<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <g stroke="#CBD5E1" stroke-width="0.75" fill="none" opacity="0.12">
    
    <!-- ==================== ROOM 1: LIVING & DINING (Top Right) ==================== -->
    <!-- Outer & Inner Walls -->
    <rect x="300" y="20" width="280" height="260" stroke-width="1.2"/>
    <rect x="304" y="24" width="272" height="252" stroke-width="0.4"/>
    
    <!-- Large Terrace Window / Sliding Door -->
    <line x1="380" y1="20" x2="500" y2="20" stroke="#FFFFFF" stroke-width="2.5"/> <!-- Cut wall -->
    <line x1="380" y1="18" x2="500" y2="18" stroke-width="0.6"/>
    <line x1="380" y1="22" x2="500" y2="22" stroke-width="0.6"/>
    <line x1="440" y1="16" x2="495" y2="16" stroke-width="0.6"/> <!-- Sliding glass -->

    <!-- Dining Table with 6 Chairs -->
    <rect x="340" y="60" width="70" height="110" rx="6" stroke-width="0.6"/>
    <!-- Chairs -->
    <rect x="318" y="75" width="16" height="22" rx="3" stroke-width="0.5"/>
    <rect x="318" y="130" width="16" height="22" rx="3" stroke-width="0.5"/>
    <rect x="416" y="75" width="16" height="22" rx="3" stroke-width="0.5"/>
    <rect x="416" y="130" width="16" height="22" rx="3" stroke-width="0.5"/>
    <rect x="364" y="38" width="22" height="16" rx="3" stroke-width="0.5"/>
    <rect x="364" y="176" width="22" height="16" rx="3" stroke-width="0.5"/>

    <!-- Large L-Sofa & Coffee Table -->
    <path d="M 470,140 L 550,140 L 550,230 L 515,230 L 515,175 L 470,175 Z" stroke-width="0.6"/>
    <rect x="475" y="185" width="35" height="35" rx="4" stroke-width="0.5"/>

    <!-- Door swing into hallway (Room 1 Entrance) -->
    <line x1="300" y1="210" x2="300" y2="250" stroke="#FFFFFF" stroke-width="3"/> <!-- Wall Opening -->
    <path d="M 300,210 A 40,40 0 0,1 340,250 L 300,250 Z" stroke-width="0.6" stroke-dasharray="2,2"/>
    <line x1="300" y1="210" x2="340" y2="210" stroke-width="0.8"/> <!-- Door panel -->


    <!-- ==================== ROOM 2: KITCHEN (Top Left) ==================== -->
    <rect x="20" y="20" width="280" height="200" stroke-width="1.2"/>
    <rect x="24" y="24" width="272" height="192" stroke-width="0.4"/>
    
    <!-- Kitchen Counter Island & Cooktop -->
    <rect x="45" y="45" width="180" height="40" rx="2" stroke-width="0.6"/>
    <rect x="65" y="52" width="50" height="26" rx="2" stroke-width="0.5"/> <!-- Cooktop -->
    <circle cx="78" cy="65" r="7" stroke-width="0.4"/>
    <circle cx="102" cy="65" r="7" stroke-width="0.4"/>
    <circle cx="78" cy="65" r="3" stroke-width="0.3"/>
    <circle cx="102" cy="65" r="3" stroke-width="0.3"/>
    <!-- Sink -->
    <rect x="145" y="50" width="40" height="30" rx="2" stroke-width="0.5"/>
    <circle cx="165" cy="65" r="3" stroke-width="0.4"/>

    <!-- Door swing (Kitchen to Hall) -->
    <line x1="160" y1="220" x2="200" y2="220" stroke="#FFFFFF" stroke-width="3"/>
    <path d="M 160,220 A 40,40 0 0,0 200,180 L 200,220 Z" stroke-width="0.6" stroke-dasharray="2,2"/>
    <line x1="160" y1="220" x2="160" y2="180" stroke-width="0.8"/>


    <!-- ==================== ROOM 3: CENTRAL STAIRCASE & HALL ==================== -->
    <!-- Staircase Steps & Handrail -->
    <g transform="translate(195, 235)">
      <rect x="0" y="0" width="90" height="150" stroke-width="0.8"/>
      <line x1="0" y1="15" x2="90" y2="15" stroke-width="0.4"/>
      <line x1="0" y1="30" x2="90" y2="30" stroke-width="0.4"/>
      <line x1="0" y1="45" x2="90" y2="45" stroke-width="0.4"/>
      <line x1="0" y1="60" x2="90" y2="60" stroke-width="0.4"/>
      <line x1="0" y1="75" x2="90" y2="75" stroke-width="0.4"/>
      <line x1="0" y1="90" x2="90" y2="90" stroke-width="0.4"/>
      <line x1="0" y1="105" x2="90" y2="105" stroke-width="0.4"/>
      <line x1="0" y1="120" x2="90" y2="120" stroke-width="0.4"/>
      <line x1="0" y1="135" x2="90" y2="135" stroke-width="0.4"/>
      <!-- Direction arrow -->
      <path d="M 45,135 L 45,25 L 38,35 M 45,25 L 52,35" stroke-width="0.7"/>
      <circle cx="45" cy="135" r="2.5" fill="#CBD5E1"/>
    </g>


    <!-- ==================== ROOM 4: MASTER BATHROOM (Bottom Left) ==================== -->
    <rect x="20" y="220" width="165" height="360" stroke-width="1.2"/>
    <rect x="24" y="224" width="157" height="352" stroke-width="0.4"/>

    <!-- Freestanding Oval Bathtub -->
    <rect x="45" y="250" width="60" height="110" rx="30" stroke-width="0.7"/>
    <rect x="52" y="257" width="46" height="96" rx="23" stroke-width="0.4"/>
    <circle cx="75" cy="270" r="3" stroke-width="0.4"/>

    <!-- Double Washbasin / Vanity -->
    <rect x="45" y="440" width="115" height="40" rx="3" stroke-width="0.6"/>
    <ellipse cx="75" cy="460" rx="18" ry="12" stroke-width="0.4"/>
    <ellipse cx="130" cy="460" rx="18" ry="12" stroke-width="0.4"/>

    <!-- Bathroom Door swing -->
    <line x1="185" y1="280" x2="185" y2="320" stroke="#FFFFFF" stroke-width="3"/>
    <path d="M 185,280 A 40,40 0 0,1 145,320 L 185,320 Z" stroke-width="0.6" stroke-dasharray="2,2"/>
    <line x1="185" y1="280" x2="145" y2="280" stroke-width="0.8"/>


    <!-- ==================== ROOM 5: BEDROOM / OFFICE (Bottom Right) ==================== -->
    <rect x="300" y="300" width="280" height="280" stroke-width="1.2"/>
    <rect x="304" y="304" width="272" height="272" stroke-width="0.4"/>

    <!-- Double Bed with Pillows & Nightstands -->
    <rect x="360" y="420" width="160" height="140" rx="4" stroke-width="0.7"/>
    <rect x="375" y="430" width="60" height="30" rx="3" stroke-width="0.4"/> <!-- Pillow 1 -->
    <rect x="445" y="430" width="60" height="30" rx="3" stroke-width="0.4"/> <!-- Pillow 2 -->
    <line x1="360" y1="470" x2="520" y2="470" stroke-width="0.4"/> <!-- Blanket fold -->
    <!-- Nightstands -->
    <rect x="320" y="425" width="30" height="30" rx="2" stroke-width="0.5"/>
    <rect x="530" y="425" width="30" height="30" rx="2" stroke-width="0.5"/>

    <!-- Bedroom Door swing -->
    <line x1="300" y1="340" x2="300" y2="380" stroke="#FFFFFF" stroke-width="3"/>
    <path d="M 300,340 A 40,40 0 0,1 340,380 L 300,380 Z" stroke-width="0.6" stroke-dasharray="2,2"/>
    <line x1="300" y1="340" x2="340" y2="340" stroke-width="0.8"/>

    <!-- Window on bottom wall -->
    <line x1="400" y1="580" x2="500" y2="580" stroke="#FFFFFF" stroke-width="3"/>
    <line x1="400" y1="578" x2="500" y2="578" stroke-width="0.6"/>
    <line x1="400" y1="582" x2="500" y2="582" stroke-width="0.6"/>

    <!-- Interconnecting outer grid lines for smooth seamless tiling -->
    <line x1="0" y1="20" x2="600" y2="20" stroke-width="0.5" stroke-dasharray="4,6"/>
    <line x1="0" y1="580" x2="600" y2="580" stroke-width="0.5" stroke-dasharray="4,6"/>
    <line x1="20" y1="0" x2="20" y2="600" stroke-width="0.5" stroke-dasharray="4,6"/>
    <line x1="580" y1="0" x2="580" y2="600" stroke-width="0.5" stroke-dasharray="4,6"/>

  </g>
</svg>
