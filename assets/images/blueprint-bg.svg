<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" opacity="0.3">
  <!-- Grid backdrop helper lines -->
  <line x1="0" y1="30" x2="400" y2="30" stroke="#0F1E36" stroke-width="0.3" stroke-dasharray="1,5"/>
  <line x1="0" y1="120" x2="400" y2="120" stroke="#0F1E36" stroke-width="0.3" stroke-dasharray="1,5"/>
  <line x1="0" y1="210" x2="400" y2="210" stroke="#0F1E36" stroke-width="0.3" stroke-dasharray="1,5"/>
  <line x1="60" y1="0" x2="60" y2="300" stroke="#0F1E36" stroke-width="0.3" stroke-dasharray="1,5"/>
  <line x1="200" y1="0" x2="200" y2="300" stroke="#0F1E36" stroke-width="0.3" stroke-dasharray="1,5"/>
  
  <!-- Outer Walls -->
  <rect x="50" y="40" width="300" height="220" fill="none" stroke="#0F1E36" stroke-width="1.5" />
  <rect x="46" y="36" width="308" height="228" fill="none" stroke="#0F1E36" stroke-width="0.5" />
  
  <!-- Inner Walls -->
  <line x1="180" y1="40" x2="180" y2="260" stroke="#0F1E36" stroke-width="1.2" />
  <line x1="176" y1="40" x2="176" y2="260" stroke="#0F1E36" stroke-width="0.5" />
  
  <line x1="50" y1="140" x2="180" y2="140" stroke="#0F1E36" stroke-width="1.2" />
  <line x1="50" y1="136" x2="180" y2="136" stroke="#0F1E36" stroke-width="0.5" />

  <line x1="180" y1="180" x2="350" y2="180" stroke="#0F1E36" stroke-width="1.2" />
  <line x1="180" y1="176" x2="350" y2="176" stroke="#0F1E36" stroke-width="0.5" />

  <!-- Door swings -->
  <!-- Door 1 -->
  <path d="M 180,100 A 20,20 0 0,1 200,120 L 180,120 Z" fill="none" stroke="#C5A880" stroke-width="0.8"/>
  <line x1="180" y1="120" x2="180" y2="100" stroke="#C5A880" stroke-width="0.8" />
  
  <!-- Door 2 -->
  <path d="M 140,140 A 20,20 0 0,1 120,160 L 120,140 Z" fill="none" stroke="#C5A880" stroke-width="0.8"/>
  <line x1="120" y1="140" x2="140" y2="140" stroke="#C5A880" stroke-width="0.8" />

  <!-- Stairs -->
  <g transform="translate(240, 50)">
    <rect x="0" y="0" width="40" height="80" fill="none" stroke="#0F1E36" stroke-width="0.6"/>
    <line x1="0" y1="10" x2="40" y2="10" stroke="#0F1E36" stroke-width="0.5"/>
    <line x1="0" y1="20" x2="40" y2="20" stroke="#0F1E36" stroke-width="0.5"/>
    <line x1="0" y1="30" x2="40" y2="30" stroke="#0F1E36" stroke-width="0.5"/>
    <line x1="0" y1="40" x2="40" y2="40" stroke="#0F1E36" stroke-width="0.5"/>
    <line x1="0" y1="50" x2="40" y2="50" stroke="#0F1E36" stroke-width="0.5"/>
    <line x1="0" y1="60" x2="40" y2="60" stroke="#0F1E36" stroke-width="0.5"/>
    <line x1="0" y1="70" x2="40" y2="70" stroke="#0F1E36" stroke-width="0.5"/>
    <!-- Direction arrow -->
    <path d="M 20,70 L 20,15 L 15,22 M 20,15 L 25,22" fill="none" stroke="#C5A880" stroke-width="0.8"/>
    <circle cx="20" cy="70" r="1.5" fill="#C5A880"/>
  </g>

  <!-- Dimension lines -->
  <g stroke="#C5A880" stroke-width="0.5" fill="none">
    <!-- Left vertical dim -->
    <line x1="25" y1="40" x2="25" y2="260"/>
    <line x1="20" y1="40" x2="30" y2="40"/>
    <line x1="20" y1="260" x2="30" y2="260"/>
    <!-- Slash indicators -->
    <line x1="22" y1="38" x2="28" y2="42" stroke-width="0.8"/>
    <line x1="22" y1="258" x2="28" y2="262" stroke-width="0.8"/>
    
    <!-- Top horizontal dim -->
    <line x1="50" y1="20" x2="350" y2="20"/>
    <line x1="50" y1="15" x2="50" y2="25"/>
    <line x1="350" y1="15" x2="350" y2="25"/>
    <line x1="48" y1="18" x2="52" y2="22" stroke-width="0.8"/>
    <line x1="348" y1="18" x2="352" y2="22" stroke-width="0.8"/>
  </g>
  
  <!-- Labels -->
  <text x="23" y="155" transform="rotate(-90 23 155)" font-family="monospace" font-size="7" fill="#C5A880" text-anchor="middle">12.50 m</text>
  <text x="200" y="16" font-family="monospace" font-size="7" fill="#C5A880" text-anchor="middle">15.00 m</text>
  
  <text x="110" y="90" font-family="sans-serif" font-weight="700" font-size="8" fill="#0F1E36" opacity="0.6" text-anchor="middle">KÜCHE / ESSEN</text>
  <text x="110" y="200" font-family="sans-serif" font-weight="700" font-size="8" fill="#0F1E36" opacity="0.6" text-anchor="middle">DIELE</text>
  <text x="270" y="200" font-family="sans-serif" font-weight="700" font-size="8" fill="#0F1E36" opacity="0.6" text-anchor="middle">WOHNEN</text>
</svg>
